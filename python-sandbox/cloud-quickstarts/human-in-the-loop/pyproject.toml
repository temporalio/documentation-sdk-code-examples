[project]
name = "temporal-human-in-the-loop-quickstart-py"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "temporalio>=1.35",
  "openai>=1.59.6",
  "pydantic>=2.10.3",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
