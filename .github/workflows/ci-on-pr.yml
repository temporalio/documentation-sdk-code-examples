name: Compile check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet-sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build temporaliodotnethelloworld.sln --configuration Release

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go-sandbox/go.mod
          cache-dependency-path: go-sandbox/go.sum
      - run: go build ./...
      # Compiles test files too, without running them
      - run: go vet ./...

  java:
    name: Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            java-sandbox/*/pom.xml
            java-sandbox/*/*/pom.xml
      # Each subfolder is its own Maven module with no parent POM, so compile
      # them one at a time. Force a single compiler release across modules.
      - run: |
          shopt -s nullglob
          status=0
          for pom in */pom.xml */*/pom.xml; do
            echo "::group::${pom%/pom.xml}"
            mvn -B -f "$pom" test-compile -Dmaven.compiler.release=21 || status=1
            echo "::endgroup::"
          done
          exit $status

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m compileall -q -x '/\.venv/' .

  php:
    name: PHP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php-sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          tools: composer
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --no-progress
      - run: |
          status=0
          for f in $(find . -path ./vendor -prune -o -name '*.php' -print); do
            php -l "$f" || status=1
          done
          exit $status

  ruby:
    name: Ruby
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby-sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
      - run: |
          status=0
          for f in $(find . -name '*.rb'); do
            ruby -wc "$f" || status=1
          done
          exit $status

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust-sandbox
      # Each sample is its own crate (the root crate, quickstart/, workflows/<page>/, activities/<page>/).
      # They share one target directory so dependencies compile once.
      - run: |
          for manifest in Cargo.toml */Cargo.toml */*/Cargo.toml; do
            [ -f "$manifest" ] || continue
            echo "::group::$manifest"
            cargo check --all-targets --locked --manifest-path "$manifest"
            echo "::endgroup::"
          done
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust-sandbox/target
      - name: Compile Rust External Storage samples
        run: cargo check --manifest-path external-storage/Cargo.toml --all-targets --locked --features s3
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust-sandbox/target

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript-sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: typescript-sandbox/.nvmrc
          cache: npm
          cache-dependency-path: typescript-sandbox/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
