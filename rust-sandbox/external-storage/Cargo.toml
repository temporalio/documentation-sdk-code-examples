[package]
name = "temporal-external-storage-example"
version = "0.1.0"
edition = "2024"

[features]
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]

[dependencies]
anyhow = "1"
futures = "0.3"
prost = "0.14"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
aws-config = { version = "=1.8.11", features = ["credentials-login"], optional = true }
aws-sdk-s3 = { version = "=1.115.0", optional = true }
temporalio-client = { git = "https://github.com/temporalio/sdk-rust", rev = "51009f8c1163f333816ef1b2ffa7b66ba82408ba", features = ["experimental"] }
temporalio-common = { git = "https://github.com/temporalio/sdk-rust", rev = "51009f8c1163f333816ef1b2ffa7b66ba82408ba", features = ["experimental"] }
temporalio-sdk = { git = "https://github.com/temporalio/sdk-rust", rev = "51009f8c1163f333816ef1b2ffa7b66ba82408ba", features = ["experimental"] }
temporalio-macros = { git = "https://github.com/temporalio/sdk-rust", rev = "51009f8c1163f333816ef1b2ffa7b66ba82408ba" }
temporalio-workflow = { git = "https://github.com/temporalio/sdk-rust", rev = "51009f8c1163f333816ef1b2ffa7b66ba82408ba" }

[dev-dependencies]
tempfile = "3"
