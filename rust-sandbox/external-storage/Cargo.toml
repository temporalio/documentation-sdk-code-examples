[package]
name = "temporal-external-storage-example"
version = "0.1.0"
edition = "2024"

[features]
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:temporalio-aws-s3driver"]

[dependencies]
anyhow = "1"
futures = "0.3"
prost = "0.14"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
aws-config = { version = "=1.8.11", features = ["credentials-login"], optional = true }
aws-sdk-s3 = { version = "=1.115.0", optional = true }
temporalio-aws-s3driver = { version = "0.1.0", optional = true }
temporalio-client = { version = "1.2.0", features = ["experimental"] }
temporalio-common = { version = "1.2.0", features = ["experimental"] }
temporalio-sdk = { version = "1.2.0", features = ["experimental"] }
temporalio-macros = "1.2.0"
temporalio-workflow = "1.2.0"

[dev-dependencies]
tempfile = "3"
