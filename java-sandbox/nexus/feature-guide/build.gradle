plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'io.temporal:temporal-sdk:1.40.0'
    implementation 'commons-cli:commons-cli:1.9.0'
    runtimeOnly 'org.slf4j:slf4j-simple:1.7.36'

    testImplementation 'io.temporal:temporal-testing:1.40.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Generic runner:  gradle -q execute -PmainClass=io.temporal.docs.nexus.featureguide.handler.HandlerWorker --args="..."
tasks.register('execute', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    if (project.hasProperty('mainClass')) {
        mainClass.set(project.property('mainClass').toString())
    }
    standardInput = System.in
}
